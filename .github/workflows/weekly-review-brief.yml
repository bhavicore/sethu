name: Weekly review brief

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "90"
  schedule:
    # Mondays 03:00 UTC
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python -m pipeline.run --days "${{ github.event.inputs.days || '90' }}"

      - name: Append brief to job summary
        run: cat data/briefs/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "review-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data this run."
          else
            git commit -m "chore: weekly review brief run ($(date -u +%Y-%m-%d))"
            git push
          fi
